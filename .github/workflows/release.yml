name: Release artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run build

      - name: Upload NSIS setup to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $setup = Get-ChildItem "release" -Filter "*.exe" |
            Where-Object { $_.Name -match '^ScreenFlavor Setup \d+\.\d+\.\d+\.exe$' } |
            Select-Object -First 1
          if (-not $setup) {
            Write-Error "Expected release/ScreenFlavor Setup x.y.z.exe (NSIS). Found: $((Get-ChildItem release -Filter *.exe).Name -join ', ')"
            exit 1
          }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "ScreenFlavor $tag" --generate-notes
          }
          gh release upload $tag $setup.FullName --clobber
