name: Release artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run build

      - name: Upload NSIS setup to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          Write-Host "Files in release/:"
          Get-ChildItem -Path "release" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host " - $($_.Name) ($($_.Length) bytes)" }

          $setup = Get-ChildItem "release" -Filter "*.exe" -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -notmatch '__uninstaller' -and
              $_.Name -notmatch 'blockmap' -and
              $_.Name -match 'ScreenFlavor'
            } |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if (-not $setup) {
            Write-Error "No suitable ScreenFlavor .exe in release/. See listing above."
            exit 1
          }

          Write-Host "Using installer: $($setup.FullName)"

          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "ScreenFlavor $tag" --generate-notes
          }

          # Quoted path is required — the NSIS name contains spaces ("ScreenFlavor Setup x.y.z.exe").
          gh release upload $tag "$($setup.FullName)" --clobber
